	<!-- TEMPORARY diagnostic (the iPad freeze after leaving town, 2026-10-17): the web page and app
     builds inject this into <head> (tools/build_pixel_web_page.sh, tools/build_pwa.sh). A small
     badge at the top centre shows:
       js HH:MM:SS  - ticks every second from a setInterval: if it freezes too, the page's main
                      thread is blocked (a script loop or a synchronous shader compile / readback);
       game Ns      - seconds since the game last wrote window.__aetheriaState (every 0.2 s from
                      PixelGame._process): grows while the js clock still ticks = the game loop
                      stopped (wasm crash) or only the drawing stopped (WebGL context lost);
       GL LOST / ERR <text> - a webglcontextlost event or an uncaught error / rejection.
     The last 20 events are kept in localStorage "aetheria-freeze" (survive a reload). -->
<script>
(function () {
	var log = [];
	try { log = JSON.parse(localStorage.getItem("aetheria-freeze") || "[]"); } catch (e) { log = []; }
	function note(t) {
		log.push(new Date().toISOString().slice(11, 19) + " " + t);
		log = log.slice(-20);
		try { localStorage.setItem("aetheria-freeze", JSON.stringify(log)); } catch (e) { /* private mode */ }
	}
	var lastState = null, lastChange = Date.now(), flags = "";
	window.addEventListener("error", function (e) { flags = "ERR " + String(e.message).slice(0, 80); note(flags); });
	window.addEventListener("unhandledrejection", function (e) { flags = "REJ " + String(e.reason).slice(0, 80); note(flags); });
	document.addEventListener("webglcontextlost", function () { flags = "GL LOST"; note(flags); }, true);
	document.addEventListener("webglcontextrestored", function () { note("GL restored"); }, true);
	var oldErr = console.error;
	console.error = function () { try { note("console.error " + Array.prototype.join.call(arguments, " ").slice(0, 100)); } catch (e) { } return oldErr.apply(console, arguments); };
	function badge() {
		var b = document.getElementById("freeze-badge");
		if (!b && document.body) {
			b = document.createElement("div");
			b.id = "freeze-badge";
			b.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);top:calc(2px + env(safe-area-inset-top, 0px));z-index:99999;font:10px monospace;color:#fff;background:rgba(0,0,0,.45);padding:1px 5px;border-radius:4px;pointer-events:none";
			document.body.appendChild(b);
			var c = document.querySelector("canvas");
			if (c) { c.addEventListener("webglcontextlost", function () { flags = "GL LOST"; note(flags); }); }
		}
		return b;
	}
	setInterval(function () {
		if (window.__aetheriaState !== lastState) { lastState = window.__aetheriaState; lastChange = Date.now(); }
		var stale = (Date.now() - lastChange) / 1000;
		if (stale > 3 && !window.__freezeNoted) { window.__freezeNoted = true; note("game stalled (js alive) " + flags); }
		if (stale < 1) { window.__freezeNoted = false; }
		var b = badge();
		if (b) { b.textContent = "js " + new Date().toTimeString().slice(0, 8) + "  game " + stale.toFixed(0) + "s " + flags; }
	}, 1000);
}());
</script>
<!-- TEMPORARY too: the freeze overlay. Keeps the last engine console lines and shows them on
     screen when the page throws (a wasm trap, an abort), when the engine prints an abort /
     out-of-memory line ("Failed to grow the heap", "Aborted(", "RuntimeError"), or when
     window.__aetheriaState stops changing for 6 s while the browser itself still runs (the main
     loop stopped, JS thread free). A freeze with no overlay = the JS thread itself is blocked
     (a hang inside the engine or a script), not a crash. Tap the overlay to hide it. -->
<script>
(function () {
  var LINES = 40, log = [], shown = false, lastState = null, lastChange = Date.now(), t0 = Date.now();
  function stamp() { return ((Date.now() - t0) / 1000).toFixed(1) + 's '; }
  function keep(kind, args) {
    try {
      var s = Array.prototype.map.call(args, function (a) { return (a && a.stack) ? a.stack : String(a); }).join(' ');
      log.push(stamp() + kind + ': ' + s);
      if (log.length > LINES) log.shift();
      if (/Failed to grow the heap|Cannot enlarge memory|Aborted\(|RuntimeError|out of memory|OOM/i.test(s)) show('engine: ' + s.slice(0, 200));
    } catch (e) {}
  }
  ['error', 'warn', 'log'].forEach(function (k) {
    var orig = console[k];
    console[k] = function () { if (k !== 'log' || log.length < LINES || /ERROR|SCRIPT|Abort|heap/.test(arguments[0])) keep(k, arguments); return orig.apply(console, arguments); };
  });
  function memText() {
    var parts = [];
    try { if (performance.memory) parts.push('js heap ' + (performance.memory.usedJSHeapSize / 1048576).toFixed(0) + ' MB'); } catch (e) {}
    try { if (window.__aetheriaState) parts.push('state ' + JSON.stringify({ p: window.__aetheriaState.player, fps: window.__aetheriaState.fps })); } catch (e) {}
    return parts.join(' | ');
  }
  function show(reason) {
    if (shown) return;
    shown = true;
    var d = document.createElement('pre');
    d.style.cssText = 'position:fixed;left:0;top:0;right:0;max-height:70%;overflow:auto;margin:0;padding:8px;z-index:99999;' +
      'background:rgba(40,0,0,0.88);color:#fff;font:11px/1.3 monospace;white-space:pre-wrap;';
    d.textContent = 'FREEZE DIAGNOSIS (' + stamp() + ')\n' + reason + '\n' + memText() + '\n----\n' + log.join('\n');
    d.onclick = function () { d.remove(); };
    (document.body || document.documentElement).appendChild(d);
  }
  window.addEventListener('error', function (e) { keep('onerror', [e.message + ' @' + e.filename + ':' + e.lineno]); show('page error: ' + e.message); });
  window.addEventListener('unhandledrejection', function (e) { keep('rejection', [e.reason]); show('unhandled rejection: ' + e.reason); });
  setInterval(function () {
    var s = null;
    try { s = window.__aetheriaState ? JSON.stringify(window.__aetheriaState) : null; } catch (e) {}
    if (s === null) { lastChange = Date.now(); return; }      // not in the game yet
    if (s !== lastState) { lastState = s; lastChange = Date.now(); return; }
    if (!document.hidden && Date.now() - lastChange > 6000) show('main loop stopped: no game update for ' + ((Date.now() - lastChange) / 1000).toFixed(0) + ' s (JS thread is free)');
  }, 1000);
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index.20261018020620","experimentalVK":false,"fileSizes":{"index.20261018020620.pck":11067392,"index.20261018020620.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[],"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

window.aetheriaStart = (function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
});

(function () {
	const BUILD = "20261018020620";
	let started = false;
	const go = () => { if (!started) { started = true; window.aetheriaStart(); } };
	const timer = setTimeout(go, 2500);                // offline or slow: play the copy we have
	fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).then((v) => {
		let seen = null;
		try { seen = sessionStorage.getItem("aetheria-update"); } catch (e) { /* private mode */ }
		if (started || !v || !v.build || v.build === BUILD || seen === v.build) { clearTimeout(timer); go(); return; }
		clearTimeout(timer);
		started = true;
		try { sessionStorage.setItem("aetheria-update", v.build); } catch (e) { /* private mode */ }
		const notice = document.getElementById("status-notice");
		if (notice) { notice.textContent = "Updating to build " + v.build; notice.style.display = "block"; }
		const regs = ("serviceWorker" in navigator) ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]);
		const keys = ("caches" in window) ? caches.keys() : Promise.resolve([]);
		Promise.all([keys.then((ks) => Promise.all(ks.map((k) => caches.delete(k)))),
			regs.then((rs) => Promise.all(rs.map((r) => r.unregister())))])
			.catch(() => null).then(() => location.replace("index.html?u=" + v.build));
	}).catch(() => { clearTimeout(timer); go(); });
}());
		</script>
