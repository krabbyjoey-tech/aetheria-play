<!DOCTYPE html>
<html lang="en">

		<title>EMBERWISP</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<meta name="theme-color" content="#1b2033">
	<!-- TEMPORARY diagnostics (the freeze after leaving town, 2026-10-17). The web page and app builds
     inject this into <head> (tools/build_pixel_web_page.sh, tools/build_pwa.sh). Remove it once
     the freeze is understood.

     v1.0: players see none of it. The black box below always records (invisible), but the visible
     parts - the BADGE, the RED OVERLAY and the PREVIOUS SESSION panel at load - only show with
     ?diag in the page's address (index.html?diag). Problems found without it are still kept
     (aetheria-blackbox-report): open the page with ?diag and tap the badge three times to read them.

     BLACK BOX (flight recorder). Survives a reload or a killed app (localStorage):
       aetheria-blackbox  {"v":1,"rec":[...],"ev":[...]}: the last 90 one-second records and the
                          last 40 events of every session (a session = one page load, id "s").
                          record: t wall ms, s session, r browser frames (requestAnimationFrame)
                          in the last tick, g longest gap between those frames (ms), f game frame
                          (window.__aetheriaState.frame), m map, k last breadcrumb, fp fps,
                          p player px, w wasm heap MB, sm / tm / vm / bm static / texture / video /
                          buffer MB, o objects, n nodes, v visibility (v / h).
                          event: t, s, e kind (start, error, rejection, gl-lost, gl-restored,
                          pagehide, pageshow, hidden, visible, abort, console, blocked, stall,
                          recover), x text.
       aetheria-marks     the last 40 breadcrumbs [{t, s, l}], written SYNCHRONOUSLY by
                          window.__aetheriaMark(label) (the game calls it at phase boundaries,
                          WebBlackBox.mark): a hang inside a phase leaves that phase as the last mark.
       aetheria-blackbox-report  the text of the last previous-session report that showed a problem.
     Live classification (every 1 s): JS ticking but no browser frames = "browser stopped drawing";
     browser frames but the game frame stuck = "game loop stopped"; a late 1 s tick = "page
     blocked for N s" (only seen afterwards: the JS thread itself was busy).
     On load, the previous session is checked: if it ended without a pagehide while visible in the
     game, or logged a long stall / GL loss / error / abort, a PREVIOUS SESSION panel shows over
     the start screen (tap to close). Tap the badge three times quickly to open it again.

     BADGE (a corner the HUD leaves free): "js HH:MM:SS raf N game Ns": js ticks from a setInterval
     (frozen = the page's main thread is blocked), raf = browser frames in the last second, game =
     seconds since the game frame last changed (the game mirrors it while paused too: the
     new-character screen, a paused window); GL LOST / ERR <text> flags. It sat at the top centre
     over the HUD's target frame; now it starts in the bottom-left corner and, once the game
     mirrors its HUD (window.__aetheriaState: HUD widget rects and hit rects, the touch buttons,
     the joystick), moves to the first spot that covers none of them: the bottom-left corner above
     the EXP strip, else the bottom-right one, else along that bottom row, else along the top row
     (the phone's joystick and action arc fill both bottom corners; the desktop's chat bar, nav bar
     and action bar fill the whole bottom row).

     Persistence: in Chromium a mark set right before the page's main thread hangs still reaches
     disk (the browser's storage process writes it), but only in batches about a minute apart, so
     a kill of the whole browser loses up to the last minute (tools/web_checks/black_box_check.js).
     How soon WebKit (iPhone / iPad) writes localStorage to disk is not measured.

     RED OVERLAY "FREEZE DIAGNOSIS": shown at once on a page error, an engine abort / out-of-memory
     line, or a stall of 5 s; the last engine console lines. Tap it to hide it.
     The last 20 problems also go to the older log "aetheria-freeze". -->
<script>
(function () {
	'use strict';
	var KEY_BOX = 'aetheria-blackbox', KEY_MARKS = 'aetheria-marks', KEY_REPORT = 'aetheria-blackbox-report';
	var KEY_OLD = 'aetheria-freeze';
	var MAX_REC = 90, MAX_EV = 40, MAX_MARKS = 40, MAX_CONSOLE = 10;
	var STALL_MS = 5000;       // a stall this long is a problem: red overlay now, panel on the next load
	var GAP_MS = 2500;         // 1 s ticks this far apart = the page was blocked (logged, listed)
	var LIFE = { pagehide: 1, pageshow: 1, hidden: 1, visible: 1 };
	var PROBLEM = { error: 1, rejection: 1, 'gl-lost': 1, abort: 1, stall: 1 };
	var t0 = Date.now();
	var sid = t0.toString(36).slice(-5) + Math.random().toString(36).slice(2, 4);
	// the visible parts only with ?diag (or ?diag=1) in the address; the recorder always runs
	var DIAG = /[?&]diag(?:[=&]|$)/.test(location.search || '');

	function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
	function lsSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
	function parse(s, d) { try { var v = s ? JSON.parse(s) : null; return v || d; } catch (e) { return d; } }
	function list(a) { return Array.isArray(a) ? a.filter(function (x) { return x && typeof x.t === 'number'; }) : []; }
	function clip(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '~' : s; }
	function p2(n) { return n < 10 ? '0' + n : '' + n; }
	function hms(t) { var d = new Date(t); return p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()); }
	function hmsm(t) { return hms(t) + '.' + ('00' + new Date(t).getMilliseconds()).slice(-3); }
	function secs(ms) { return (ms / 1000).toFixed(1) + ' s'; }
	function pad(s, n) { s = String(s); while (s.length < n) s += ' '; return s; }
	function lpad(s, n) { s = String(s); while (s.length < n) s = ' ' + s; return s; }
	function visible() { return document.visibilityState !== 'hidden'; }

	// --- what the previous page loads left (read before this session writes anything) ----------
	var box = parse(lsGet(KEY_BOX), {});
	var oldRecs = list(box.rec), oldEvs = list(box.ev), oldMarks = list(parse(lsGet(KEY_MARKS), []));
	// stored as pre-serialised strings: a write is one join, never a re-encode of the whole ring
	var recStr = oldRecs.slice(-MAX_REC).map(function (x) { return JSON.stringify(x); });
	var evStr = oldEvs.slice(-MAX_EV).map(function (x) { return JSON.stringify(x); });
	var markStr = oldMarks.slice(-MAX_MARKS).map(function (x) { return JSON.stringify(x); });
	function push(arr, s, max) { arr.push(s); if (arr.length > max) arr.splice(0, arr.length - max); }
	function writeBox() { lsSet(KEY_BOX, '{"v":1,"rec":[' + recStr.join(',') + '],"ev":[' + evStr.join(',') + ']}'); }

	// this session, in memory (the live part of the panel)
	var cur = { marks: [], events: [], problems: [], recs: 0 };
	var lastMark = null, consoleEvents = 0, flags = '';

	// --- the older 20-line log, kept for the earlier instructions ------------------------------
	var oldLog = parse(lsGet(KEY_OLD), []);
	function note(t) {
		if (!Array.isArray(oldLog)) oldLog = [];
		oldLog.push(hms(Date.now()) + ' ' + t);
		oldLog = oldLog.slice(-20);
		lsSet(KEY_OLD, JSON.stringify(oldLog));
	}

	// --- events and breadcrumbs (both written at once) ------------------------------------------
	function event(kind, text) {
		var e = { t: Date.now(), s: sid, e: kind };
		if (text) e.x = clip(text, 160);
		push(evStr, JSON.stringify(e), MAX_EV);
		cur.events.push(e);
		if (cur.events.length > 12) cur.events.shift();
		if (PROBLEM[kind] || kind === 'blocked') { cur.problems.push(e); note(kind + ' ' + (text || '')); }
		writeBox();
		return e;
	}
	window.__aetheriaMark = function (label) {
		var m = { t: Date.now(), s: sid, l: clip(label, 64) };
		lastMark = m;
		push(markStr, JSON.stringify(m), MAX_MARKS);
		cur.marks.push(m);
		if (cur.marks.length > 12) cur.marks.shift();
		lsSet(KEY_MARKS, '[' + markStr.join(',') + ']');
	};

	// --- wasm heap size: the engine's WebAssembly.Memory, caught when the engine instantiates ----
	var wasmMem = null;
	function grab(imports) {
		return function (r) {
			try {
				var inst = r && (r.instance || r);
				var m = inst && inst.exports && inst.exports.memory;
				if (!m && imports && imports.env) m = imports.env.memory;
				if (m && m.buffer) wasmMem = m;
			} catch (e) { /* keep going */ }
			return r;
		};
	}
	if (window.WebAssembly) {
		['instantiate', 'instantiateStreaming'].forEach(function (n) {
			var f = WebAssembly[n];
			if (typeof f !== 'function') return;
			WebAssembly[n] = function (src, imports) { return f.apply(WebAssembly, arguments).then(grab(imports)); };
		});
	}
	function wasmMB() { try { return wasmMem ? Math.round(wasmMem.buffer.byteLength / 1048576) : 0; } catch (e) { return 0; } }

	// --- the browser's own frame counter (separate from the game's) ---------------------------
	var raf = 0, rafAtTick = 0, rafLast = 0, rafMaxGap = 0;
	function onRaf(ts) {
		raf++;
		if (rafLast && ts - rafLast > rafMaxGap) rafMaxGap = ts - rafLast;
		rafLast = ts;
		window.requestAnimationFrame(onRaf);
	}
	window.requestAnimationFrame(onRaf);

	// --- console lines: engine aborts / heap growth failures; the last lines for the overlay ----
	var LINES = 40, lines = [];
	var ABORT_RE = /Failed to grow the heap|Cannot enlarge memory|Aborted\(|RuntimeError|out of memory|\bOOM\b|abort\(/i;
	function keep(kind, args) {
		try {
			var s = Array.prototype.map.call(args, function (a) { return (a && a.stack) ? a.stack : String(a); }).join(' ');
			lines.push(((Date.now() - t0) / 1000).toFixed(1) + 's ' + kind + ': ' + s);
			if (lines.length > LINES) lines.shift();
			if (ABORT_RE.test(s)) {
				event('abort', s);
				red('engine: ' + s.slice(0, 200));
			} else if (kind === 'error' && consoleEvents < MAX_CONSOLE) {
				consoleEvents++;
				event('console', s);
			}
		} catch (e) { /* never break the console */ }
	}
	['error', 'warn', 'log'].forEach(function (k) {
		var orig = console[k];
		console[k] = function () {
			if (k !== 'log' || lines.length < LINES || /ERROR|SCRIPT|Abort|heap/.test(String(arguments[0]))) keep(k, arguments);
			return orig.apply(console, arguments);
		};
	});

	// --- page events ------------------------------------------------------------------------------
	window.addEventListener('error', function (e) {
		var m = String(e.message) + (e.filename ? ' @' + String(e.filename).split('/').pop() + ':' + e.lineno : '');
		flags = 'ERR ' + clip(e.message, 60);
		event('error', m);
		red('page error: ' + m);
	});
	window.addEventListener('unhandledrejection', function (e) {
		var r = e.reason && e.reason.stack ? e.reason.stack : String(e.reason);
		flags = 'REJ ' + clip(r, 60);
		event('rejection', r);
		red('unhandled rejection: ' + r);
	});
	// WebGL context events do not bubble: a capture listener on the window sees every canvas'
	window.addEventListener('webglcontextlost', function () { flags = 'GL LOST'; event('gl-lost', 'WebGL context lost'); }, true);
	window.addEventListener('webglcontextrestored', function () { flags = 'GL restored'; event('gl-restored', 'WebGL context restored'); }, true);
	window.addEventListener('pagehide', function (e) { record(); event('pagehide', e.persisted ? 'into the back-forward cache' : ''); }, true);
	window.addEventListener('pageshow', function (e) { if (e.persisted) event('pageshow', 'back from the back-forward cache'); }, true);
	document.addEventListener('visibilitychange', function () {
		rafLast = 0;          // the hidden time is not a long frame
		if (visible()) { event('visible', ''); } else { record(); event('hidden', ''); }
	}, true);

	// --- the one-second records and the live classification -------------------------------------
	var lastTick = Date.now(), wasVisible = visible(), lastFrame = null, frameChanged = Date.now();
	var noRafMs = 0, sameFrameMs = 0, stall = null, rafAtRec = 0;
	function record() {
		var st = window.__aetheriaState || null, mem = (st && st.mem) || null;
		var r = { t: Date.now(), s: sid, r: raf - rafAtRec, g: Math.round(rafMaxGap), v: visible() ? 'v' : 'h' };
		rafAtRec = raf;
		rafMaxGap = 0;
		if (st) {
			r.f = st.frame;
			r.m = st.map || (mem && mem.map) || '';
			r.fp = st.fps;
			if (st.player) r.p = [Math.round(st.player[0]), Math.round(st.player[1])];
		}
		var w = wasmMB();
		if (w) r.w = w;
		if (mem) {
			if (mem.static_mb > 0) r.sm = mem.static_mb;      // Godot counts it in debug builds only (0 in a release export)
			r.tm = mem.tex_mb; r.vm = mem.vid_mb; r.bm = mem.buf_mb; r.o = mem.objects; r.n = mem.nodes;
		}
		if (lastMark) r.k = clip(lastMark.l, 48);
		push(recStr, JSON.stringify(r), MAX_REC);
		cur.recs++;
		writeBox();
		return r;
	}
	function tick() {
		var now = Date.now(), dt = now - lastTick, vis = visible();
		lastTick = now;
		if (dt >= GAP_MS && wasVisible && vis) {
			event('blocked', 'page blocked ~' + secs(dt - 1000) + ' (1 s ticks ' + secs(dt) + ' apart); last mark: ' +
				(lastMark ? lastMark.l : '-'));
		}
		var rafN = raf - rafAtTick;
		rafAtTick = raf;
		var st = window.__aetheriaState || null, f = st ? st.frame : null;
		if (f !== lastFrame) { lastFrame = f; frameChanged = now; }
		// only on-time ticks count towards a stall: the JS thread was free all along. A late tick
		// is a blocked page (one long frame can cover it without the game frame changing).
		if (vis && dt < GAP_MS) {
			noRafMs = rafN === 0 ? noRafMs + dt : 0;
			sameFrameMs = (st && rafN > 0 && now - frameChanged >= dt) ? sameFrameMs + dt : 0;
		} else {
			noRafMs = 0;
			sameFrameMs = 0;
		}
		var kind = noRafMs >= STALL_MS ? 'browser stopped drawing' : (sameFrameMs >= STALL_MS ? 'game loop stopped' : '');
		if (kind && !stall) {
			stall = { kind: kind, since: now - (noRafMs >= STALL_MS ? noRafMs : sameFrameMs) };
			event('stall', kind + ' since ' + hms(stall.since) + ' (the JS clock still ticks); last mark: ' + (lastMark ? lastMark.l : '-'));
			red(kind + ' for ' + secs(now - stall.since) + ' (the JS thread is free)');
		} else if (!kind && stall) {
			event('recover', stall.kind + ' ended after ' + secs(now - stall.since));
			stall = null;
		}
		record();
		wasVisible = vis;
		var b = badge();
		if (b) {
			var live = noRafMs >= 2000 ? ' NO DRAW' : (sameFrameMs >= 2000 ? ' LOOP STOPPED' : '');
			b.textContent = 'js ' + hms(now) + ' raf ' + rafN + ' game ' + (st ? ((now - frameChanged) / 1000).toFixed(0) + 's' : '-') + live + (flags ? ' ' + flags : '');
			place(b, st);
		}
	}

	// --- the previous session: how it ended --------------------------------------------------------
	function kilo(n) { return n === undefined ? '-' : (n >= 10000 ? (n / 1000).toFixed(1) + 'k' : '' + n); }
	function shortMap(m) { return { brightvale: 'town', dewleaf_fields: 'field', dewleaf_crossing: 'crossing' }[m] || clip(m || '-', 8); }
	function analyse() {
		var id = null, best = -1;
		[oldRecs, oldEvs, oldMarks].forEach(function (a) { a.forEach(function (x) { if (x.s && x.t > best) { best = x.t; id = x.s; } }); });
		if (!id) return null;
		var mine = function (x) { return x.s === id; };
		var R = oldRecs.filter(mine), E = oldEvs.filter(mine), M = oldMarks.filter(mine);
		var all = R.concat(E, M), start = Infinity, end = 0;
		all.forEach(function (x) { if (x.t < start) start = x.t; if (x.t > end) end = x.t; });
		var lastRec = R.length ? R[R.length - 1] : null, lastM = M.length ? M[M.length - 1] : null;
		var life = E.filter(function (e) { return LIFE[e.e]; }), lastLife = life.length ? life[life.length - 1] : null;
		// unloading fires pagehide, then visibilitychange to hidden: a session ended cleanly when its
		// last pagehide was not followed by a pageshow (a return from the back-forward cache)
		var hides = E.filter(function (e) { return e.e === 'pagehide'; }), lastHide = hides.length ? hides[hides.length - 1] : null;
		var clean = !!lastHide && !E.some(function (e) { return e.e === 'pageshow' && e.t > lastHide.t; });
		var hiddenEnd = !clean && (lastLife ? lastLife.e === 'hidden' : !!(lastRec && lastRec.v === 'h'));
		var inGame = M.length > 0 || R.some(function (r) { return r.f !== undefined; });
		var problems = [];
		// the first map's +3 s mark: a block before it is the engine start (listed, never alone a reason for the panel)
		var playing = M.filter(function (m) { return / arrival \+3 s/.test(m.l); }).map(function (m) { return m.t; })[0] || Infinity;
		// gaps between consecutive visible records = the page was blocked (with the phases inside);
		// the session start counts as a record, so a block before the first tick shows too
		var startEv = E.filter(function (e) { return e.e === 'start'; })[0];
		var RG = startEv ? [{ t: startEv.t, v: 'v' }].concat(R) : R;
		for (var i = 1; i < RG.length; i++) {
			var a = RG[i - 1], b = RG[i], gap = b.t - a.t;
			if (gap < GAP_MS || a.v !== 'v' || b.v !== 'v') continue;
			if (life.some(function (e) { return e.t > a.t && e.t < b.t; })) continue;
			// the phases marked inside the gap, longest first (each lasts until the next mark)
			var inside = M.filter(function (m) { return m.t > a.t && m.t < b.t; }).map(function (m, j, arr) {
				return [m.l, (j + 1 < arr.length ? arr[j + 1].t : b.t) - m.t];
			}).sort(function (x, y) { return y[1] - x[1]; });
			problems.push({ t: a.t, sev: gap >= STALL_MS + 1000 && a.t > playing ? 2 : 1, text: 'page blocked ~' + secs(gap - 1000) +
				(a.t < playing ? ' while starting' : '') + ' (' + hms(a.t) + ' -> ' + hms(b.t) + ')' + (inside.length ? '; longest phases: ' +
				inside.slice(0, 4).map(function (x) { return x[0] + ' ' + secs(x[1]); }).join(', ') + (inside.length > 4 ? ' (+' + (inside.length - 4) + ' more)' : '') : '') });
		}
		var openStall = null;
		E.forEach(function (e) {
			if (e.e === 'stall') { openStall = e; problems.push({ t: e.t, sev: 2, text: e.x || 'stall' }); }
			else if (e.e === 'recover') { openStall = null; problems.push({ t: e.t, sev: 1, text: e.x || 'recovered' }); }
			else if (PROBLEM[e.e]) problems.push({ t: e.t, sev: 2, text: e.e + ': ' + (e.x || '') });
			else if (e.e === 'gl-restored') problems.push({ t: e.t, sev: 1, text: e.x || 'WebGL context restored' });
		});
		problems.sort(function (x, y) { return x.t - y.t; });
		var how;
		if (clean) how = 'closed normally (pagehide at ' + hms(lastHide.t) + ').';
		else if (hiddenEnd) how = 'went to the background at ' + hms(lastLife ? lastLife.t : lastRec.t) +
			' and ended there without a pagehide (iOS or the user closed it in the background).';
		else if (openStall) how = (openStall.x || 'stall').split(' (')[0] + ': the JS clock kept ticking until ' + (lastRec ? hms(lastRec.t) : '?') +
			', then the page ended without a pagehide.';
		else if (lastM && (!lastRec || lastM.t > lastRec.t)) how = 'the JS thread stopped inside "' + lastM.l + '" (marked ' + hmsm(lastM.t) +
			', no 1 s record after it): blocked there until the page was killed or closed; no pagehide.';
		else if (lastRec && lastRec.r === 0) how = 'the browser had stopped drawing (no animation frames) at ' + hms(lastRec.t) +
			' while the JS clock ticked; then the page ended without a pagehide.';
		else if (lastRec) how = 'ran normally until ' + hms(lastRec.t) + ' (last record: ' + lastRec.r + ' browser frames/s' +
			(lastRec.f !== undefined ? ', game frame ' + lastRec.f : '') + '), then nothing and no pagehide: killed or closed while visible, ' +
			'or the JS thread blocked right after its last record.';
		else how = 'no records (the page ended within a second of loading).';
		var serious = problems.some(function (p) { return p.sev >= 2; });
		return { id: id, start: start, end: end, R: R, E: E, M: M, clean: clean, hiddenEnd: hiddenEnd, inGame: inGame,
			problems: problems, how: how, show: (inGame && !clean && !hiddenEnd) || serious };
	}

	function recLine(r, prev) {
		var gf = (r.f !== undefined && prev && prev.f !== undefined) ? '+' + (r.f - prev.f) : (r.f !== undefined ? '' + r.f : '-');
		return hms(r.t) + ' ' + pad(shortMap(r.m), 8) + lpad(r.r, 4) + lpad(r.g, 6) + lpad(gf, 6) + lpad(r.fp !== undefined ? r.fp : '-', 4) +
			lpad(r.w || '-', 5) + lpad(r.tm !== undefined ? Math.round(r.tm) : '-', 5) + lpad(kilo(r.o), 6) + '  ' + r.v + '  ' + clip(r.k || '', 40);
	}
	var REC_HEAD = 'time     map       raf  long   +gf fps wasm  tex   objs vis last mark';
	function report(a) {
